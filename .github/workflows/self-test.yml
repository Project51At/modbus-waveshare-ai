name: Self Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  self-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run self-test
        run: python modbus-waveshare-ai.py --self-test
